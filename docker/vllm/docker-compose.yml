# Purpose: Local vLLM CPU container for Orbstack (macOS/arm64).
# Notes: CPU-only; set HF_TOKEN in your shell if the model requires auth.
services:
  vllm:
    image: public.ecr.aws/q9t5s3a7/vllm-arm64-cpu-release-repo:v${VLLM_VERSION:-0.14.1}
    platform: linux/arm64
    container_name: vllm
    ports:
      - "8000:8000"
    ipc: host
    environment:
      - VLLM_USE_V1=0
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command:
      - "${VLLM_MODEL:-alexchen4ai/Qwen3-8B-Instruct}"
      - "--served-model-name"
      - "${VLLM_MODEL:-alexchen4ai/Qwen3-8B-Instruct}"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "${VLLM_TOOL_CALL_PARSER:-hermes}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
